name: Build package for Ubuntu 22.04 x86_64

on:
  # Déclenchement UNIQUEMENT sur les tags
  push:
    tags:
      - 'v*'
  # Déclenchement manuel optionnel (pour tester sans tag)
  workflow_dispatch:

jobs:
  build-wheel:
    name: Build Wheel (${{ github.ref_name }}, Python 3.9)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            pkg-config \
            libssl-dev \
            libclang-dev \
            cmake \
            git

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install setuptools_rust cython

      - name: Build Wheel
        run: |
          rm -rf build dist *.egg-info
          cd python
          python setup.py bdist_wheel --dist-dir=dist

      - name: List generated wheels
        run: |
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snips-nlu-parsers-${{ github.ref_name }}
          path: dist/*.whl

      - name: Publish to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.whl
          tag_name: ${{ github.ref_name }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}